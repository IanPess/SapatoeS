</head>

<body>

<!-- NAVBAR responsiva -->
<nav class="navbar navbar-expand-lg navbar-dark bg-dark">

<div class="container">

<!-- Logo -->
<a class="navbar-brand" href="#">Loja Shoes</a>

<!-- Botão hamburguer -->
<button class="navbar-toggler"
type="button"
data-bs-toggle="collapse"
data-bs-target="#menu">

<span class="navbar-toggler-icon"></span>

</button>

<!-- Menu colapsável -->
<div class="collapse navbar-collapse" id="menu">

<ul class="navbar-nav ms-auto">

<li class="nav-item">
<a class="nav-link" href="index.html">Home</a>
</li>

<li class="nav-item">
<a class="nav-link" href="cadastro.html">Cadastro</a>
</li>

<li class="nav-item">

</li>

<!-- Página atual (active) -->
<li class="nav-item">
<a class="nav-link active" href="dashboard.html">Dashboard</a>
</li>

<li class="nav-item">
<a class="nav-link" href="produtos.html">Produtos</a>
</li>

</ul>

</div>

</div>

</nav>

<!-- CONTEÚDO PRINCIPAL -->
<div class="container mt-5">

<!-- Título centralizado -->
<h2 class="text-center mb-4">Painel Administrativo</h2>

<!-- GRID com espaçamento (g-4 = gap) -->
<div class="row g-4">

<!-- CARD 1 -->
<div class="col-12 col-md-4">
<!-- col-12 = 100% no mobile -->
<!-- col-md-4 = 3 colunas no desktop -->

<div class="card text-white bg-primary text-center shadow">

<div class="card-body">

<!-- Ícone -->
<i class="bi bi-people-fill fs-1"></i>

<!-- Título -->
<h5 class="mt-3">Total de Clientes</h5>

<!-- Número destacado -->
<p class="fs-3 fw-bold">120</p>

</div>

</div>

</div>

<!-- CARD 2 -->
<div class="col-12 col-md-4">

<div class="card text-white bg-success text-center shadow">

<div class="card-body">

<i class="bi bi-cart-check-fill fs-1"></i>

<h5 class="mt-3">Vendas do Mês</h5>

<p class="fs-3 fw-bold">85</p>

</div>

</div>

</div>

<!-- CARD 3 -->
<div class="col-12 col-md-4">

<div class="card text-white bg-danger text-center shadow">

<div class="card-body">

<i class="bi bi-exclamation-triangle-fill fs-1"></i>

<h5 class="mt-3">Produtos em Falta</h5>

<p class="fs-3 fw-bold">6</p>

</div>

</div>

</div>

</div>

</div>

<!-- JS do Bootstrap -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
