<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <!-- Define o conjunto de caracteres -->
    <meta charset="UTF-8">

    <!-- Responsividade (ESSENCIAL para o Bootstrap funcionar bem em celular) -->
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Loja de Sapatos</title>

    <!-- Importação do CSS do Bootstrap -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
        rel="stylesheet">
</head>

<body>

    <!-- NAVBAR (barra de navegação responsiva do Bootstrap) -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">

        <!-- container centraliza e limita largura -->
        <div class="container">

            <!-- Marca/logo -->
            <a class="navbar-brand" href="#">Loja Shoes</a>

            <!-- Botão hamburguer (aparece em telas pequenas) -->
            <button class="navbar-toggler"
                type="button"
                data-bs-toggle="collapse"
                data-bs-target="#menu">

                <!-- Ícone do botão -->
                <span class="navbar-toggler-icon"></span>
            </button>

            <!-- Menu que colapsa no mobile -->
            <div class="collapse navbar-collapse" id="menu">

                <!-- ms-auto joga o menu pra direita -->
                <ul class="navbar-nav ms-auto">

                    <li class="nav-item">
                        <a class="nav-link active" href="index.html">Home</a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="cadastro.html">Cadastro</a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="listagem.html">Listagem</a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="dashboard.html">Dashboard</a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="produtos.html">Produtos</a>
                    </li>

                </ul>
            </div>
        </div>
    </nav>

    <!-- CONTAINER PRINCIPAL -->
    <div class="container mt-5">

        <!-- GRID SYSTEM do Bootstrap -->
        <div class="row text-center">

            <!-- col-12 ocupa toda largura -->
            <div class="col-12">

                <!-- Tipografia Bootstrap -->
                <h1 class="display-5 fw-bold">Bem-vindo à Loja de Sapatos</h1>

                <p class="lead">
                    Os melhores modelos com os melhores preços.
                </p>

                <!-- Botão estilizado -->
                <a href="produtos.html" class="btn btn-primary btn-lg">
                    Ver Produtos
                </a>

            </div>
        </div>

        <!-- CAROUSEL (slider de imagens do Bootstrap) -->
        <div id="carouselExample" class="carousel slide mt-5 mb-5">

            <!-- Área interna dos slides -->
            <div class="carousel-inner">

                <!-- Slide ativo -->
                <div class="carousel-item active">
                    <img src="img/martinhodetomarti.jpg"
                        class="d-block w-100 rounded-4">

                    <!-- Texto sobre a imagem -->
                    <div class="carousel-caption d-none d-md-block">
                        <h2>OS MELHORES TÊNIS DO MERCADO</h2>
                    </div>
                </div>

                <!-- Outro slide -->
                <div class="carousel-item">
                    <img src="img/relampagomarquim.jpg"
                        class="d-block w-100 rounded-4">

                    <div class="carousel-caption d-none d-md-block">
                        <h2>CONFORTO E ESTILO</h2>
                    </div>
                </div>

                <!-- Outro slide -->
                <div class="carousel-item">
                    <img src="img/bobiespoja.jpg"
                        class="d-block w-100 rounded-4">

                    <div class="carousel-caption d-none d-md-block">
                        <h2>PREÇOS IMPERDÍVEIS</h2>
                    </div>
                </div>

            </div>

            <!-- Botão anterior -->
            <button class="carousel-control-prev" type="button"
                data-bs-target="#carouselExample" data-bs-slide="prev">
                <span class="carousel-control-prev-icon"></span>
            </button>

            <!-- Botão próximo -->
            <button class="carousel-control-next" type="button"
                data-bs-target="#carouselExample" data-bs-slide="next">
                <span class="carousel-control-next-icon"></span>
            </button>

        </div>

    </div>

    <!-- JS do Bootstrap (necessário para navbar e carousel funcionarem) -->
    <script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
