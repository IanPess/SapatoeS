<!DOCTYPE html>
<html lang="pt-BR">

    <head>

        <title>Cadastro</title>
        <meta charset="UTF-8">

        <meta name="viewport" content="width=device-width, initial-scale=1">

        <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
            rel="stylesheet">

    </head>

    <body>

        <nav class="navbar navbar-expand-lg navbar-dark bg-dark">

            <div class="container">

                <a class="navbar-brand" href="#">Loja Shoes</a>

                <button class="navbar-toggler"
                    type="button"
                    data-bs-toggle="collapse"
                    data-bs-target="#menu"
                    aria-controls="menu"
                    aria-expanded="false"
                    aria-label="Toggle navigation">

                    <span class="navbar-toggler-icon"></span>

                </button>

                <div class="collapse navbar-collapse" id="menu">

                    <ul class="navbar-nav ms-auto">

                        <li class="nav-item">
                            <a class="nav-link" href="index.html">Home</a>
                        </li>

                        <li class="nav-item">
                            <a class="nav-link active"
                                href="cadastro.html">Cadastro</a>
                        </li>

                        <li class="nav-item">
                            <a class="nav-link"
                                href="listagem.html">Listagem</a>
                        </li>

                        <li class="nav-item">
                            <a class="nav-link"
                                href="dashboard.html">Dashboard</a>
                        </li>

                        <li class="nav-item">
                            <a class="nav-link"
                                href="produtos.html">Produtos</a>
                        </li>

                    </ul>

                </div>

            </div>

        </nav>

        <div class="container mt-5">

            <div class="row align-items-center g-4">

                <div class="col-12 col-md-6">

                    <h2 class="mb-4">Cadastro de Cliente</h2>

                    <form>

                        <div class="mb-3">
                            <label class="form-label">Nome</label>
                            <input type="text" class="form-control">
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Email</label>
                            <input type="email" class="form-control">
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Tipo de Cliente</label>

                            <select class="form-select">
                                <option>Normal</option>
                                <option>Premium</option>
                            </select>

                        </div>

                        <div class="mb-3">
                            <label class="form-label">Observação</label>
                            <textarea class="form-control" rows="3"></textarea>
                        </div>

                        <button
                            type="button"
                            class="btn btn-success"
                            data-bs-toggle="modal"
                            data-bs-target="#confirmacao">

                            Cadastrar

                        </button>

                    </form>

                </div>

                <div class="col-12 col-md-6 text-center">

                    <img src="img/chave.jpg" class="img-fluid rounded-4">

                </div>

            </div>

        </div>

        <div class="modal fade" id="confirmacao">

            <div class="modal-dialog">

                <div class="modal-content">

                    <div class="modal-header">

                        <h5 class="modal-title">Sucesso</h5>

                        <button class="btn-close"
                            data-bs-dismiss="modal"></button>

                    </div>

                    <div class="modal-body">
                        Cadastro realizado com sucesso!
                    </div>

                    <div class="modal-footer">

                        <button class="btn btn-primary" data-bs-dismiss="modal">
                            OK
                        </button>

                    </div>

                </div>

            </div>

        </div>

        <script
            src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

    </body>
</html>F
