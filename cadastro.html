<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <title>Cadastro</title>

    <!-- Charset -->
    <meta charset="UTF-8">

    <!-- Responsividade -->
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- Bootstrap CSS -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
        rel="stylesheet">

</head>

<body>

    <!-- NAVBAR -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">

        <div class="container">

            <!-- Logo -->
            <a class="navbar-brand" href="#">Loja Shoes</a>

            <!-- Botão mobile -->
            <button class="navbar-toggler"
                type="button"
                data-bs-toggle="collapse"
                data-bs-target="#menu">

                <span class="navbar-toggler-icon"></span>

            </button>

            <!-- Menu -->
            <div class="collapse navbar-collapse" id="menu">

                <ul class="navbar-nav ms-auto">

                    <li class="nav-item">
                        <a class="nav-link" href="index.html">Home</a>
                    </li>

                    <!-- Página ativa -->
                    <li class="nav-item">
                        <a class="nav-link active" href="cadastro.html">Cadastro</a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="listagem.html">Listagem</a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="dashboard.html">Dashboard</a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="produtos.html">Produtos</a>
                    </li>

                </ul>

            </div>

        </div>

    </nav>

    <!-- CONTEÚDO -->
    <div class="container mt-5">

        <!-- GRID -->
        <div class="row align-items-center g-4">

            <!-- FORMULÁRIO -->
            <div class="col-12 col-md-6">

                <h2 class="mb-4">Cadastro de Cliente</h2>

                <form>

                    <!-- INPUT NOME -->
                    <div class="mb-3">
                        <label class="form-label">Nome</label>
                        <input type="text" class="form-control">
                    </div>

                    <!-- INPUT EMAIL -->
                    <div class="mb-3">
                        <label class="form-label">Email</label>
                        <input type="email" class="form-control">
                    </div>

                    <!-- SELECT -->
                    <div class="mb-3">
                        <label class="form-label">Tipo de Cliente</label>

                        <select class="form-select">
                            <option>Normal</option>
                            <option>Premium</option>
                        </select>
                    </div>

                    <!-- TEXTAREA -->
                    <div class="mb-3">
                        <label class="form-label">Observação</label>
                        <textarea class="form-control" rows="3"></textarea>
                    </div>

                    <!-- BOTÃO que abre MODAL -->
                    <button
                        type="button"
                        class="btn btn-success"
                        data-bs-toggle="modal"
                        data-bs-target="#confirmacao">

                        Cadastrar

                    </button>

                </form>

            </div>

            <!-- IMAGEM -->
            <div class="col-12 col-md-6 text-center">

                <!-- img-fluid deixa responsiva -->
                <img src="img/chave.jpg" class="img-fluid rounded-4">

            </div>

        </div>

    </div>

    <!-- MODAL (janela popup) -->
    <div class="modal fade" id="confirmacao">

        <div class="modal-dialog">

            <div class="modal-content">

                <!-- Cabeçalho -->
                <div class="modal-header">

                    <h5 class="modal-title">Sucesso</h5>

                    <!-- Botão fechar -->
                    <button class="btn-close"
                        data-bs-dismiss="modal"></button>

                </div>

                <!-- Corpo -->
                <div class="modal-body">
                    Cadastro realizado com sucesso!
                </div>

                <!-- Rodapé -->
                <div class="modal-footer">

                    <button class="btn btn-primary" data-bs-dismiss="modal">
                        OK
                    </button>

                </div>

            </div>

        </div>

    </div>

    <!-- JS Bootstrap -->
    <script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
